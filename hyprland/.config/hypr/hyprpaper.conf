# --- Hyprpaper configuration ---

# Match all monitors (*) and set the same wallpaper
wallpaper = *,/home/misha/.config/hypr/Wallpaper.png

# Optional: stretch/fill/fixed/scaled
# "fill" scales wallpaper to cover the monitor while keeping aspect ratio
mode = fill

# Optional: whether to cache the wallpaper
cache = true

# Optional: set each monitor individually (if needed)
monitor = DP-1,/home/misha/.config/hypr/Wallpaper.png,fill
monitor = DP-2,/home/misha/.config/hypr/Wallpaper.png,fill

